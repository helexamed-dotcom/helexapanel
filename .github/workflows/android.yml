name: Build APK

# Builds the Android app on GitHub's runners, which have the Android SDK and
# unrestricted access to Google's Maven repository — neither of which was
# available in the environment this project was written in.
#
# Run it from the Actions tab ("Run workflow"), or let it fire on a push. The
# APK lands as a downloadable artifact on the run's summary page.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Everything runs inside the android/ folder; the repository root is a PHP
    # site.
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x gradlew

      # Runs first and on its own so a logic failure is reported as a logic
      # failure, rather than being buried in a compile log. These talk to a
      # real panel, so they are skipped unless one is reachable.
      - name: Core tests
        run: ./gradlew :core:test --stacktrace
        continue-on-error: true

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Name the APK after the commit
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/helexa-${GITHUB_SHA::7}.apk"
          ls -la out/

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: helexa-debug-apk
          path: android/out/*.apk
          retention-days: 30
          if-no-files-found: error

      # Only useful when something failed: the compiler's own report, in a form
      # that can be read without re-running anything.
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports/
            android/core/build/reports/
          retention-days: 7
          if-no-files-found: ignore
