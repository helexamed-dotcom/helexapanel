# Gradle's own settings for this build.
#
# Nothing here is optional decoration: AGP refuses to resolve an androidx
# dependency graph without the first flag, which is what failed every build
# before this file existed.

# This project uses androidx and nothing else. Jetifier stays off because
# there is no legacy support-library dependency to rewrite, and leaving it on
# would rewrite every jar on every build for no benefit.
android.useAndroidX=true
android.enableJetifier=false

# One R class per module, holding only that module's own resources. Keeps the
# app's R small and makes an accidental dependency on another module's
# resource a compile error rather than a surprise at runtime.
android.nonTransitiveRClass=true

# R8 in full mode: the shrinking the release build's rules were written for.
android.enableR8.fullMode=true

# Kotlin and AGP both want headroom; the default 512m metaspace is not enough
# for the Compose compiler plugin on a cold build.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
