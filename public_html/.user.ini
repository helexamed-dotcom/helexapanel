; =====================================================================
;  HeleXa Med — PHP limits for the public directory.
;
;  This file is read by PHP-FPM and CGI SAPIs, which is what DirectAdmin
;  runs by default. php_value lines in .htaccess only work under mod_php
;  and cause a 500 error everywhere else, so the limits live here.
;
;  Changes can take up to five minutes to apply (user_ini.cache_ttl).
; =====================================================================

; A 3 MB lesson with embedded images plus form fields and multipart
; overhead needs headroom; post_max_size must always exceed
; upload_max_filesize, or the upload is discarded before PHP sees it.
upload_max_filesize = 40M
post_max_size = 48M

; Pasting a large lesson into the editor is a single field, but the
; admin forms carry many inputs; the default of 1000 is easy to exceed.
max_input_vars = 5000

; Reading, scanning and hashing a multi-megabyte upload.
memory_limit = 256M

max_execution_time = 300
max_input_time = 300
